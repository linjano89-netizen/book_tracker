    <circle cx="130" cy="100" r="4" fill="#d4b84a" opacity="0.8"/>
    <circle cx="275" cy="88" r="3" fill="#f5e6c8" opacity="0.6"/>
    <circle cx="155" cy="78" r="2.5" fill="#9b7fd4" opacity="0.7"/>
