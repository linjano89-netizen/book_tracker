    <rect x="98" y="181" width="204" height="25" rx="4" fill="#e06a6a"/>
    <rect x="98" y="181" width="15" height="25" rx="3" fill="#b84a4a"/>
    <rect x="109" y="190" width="4" height="10" rx="1" fill="#f09a9a" opacity="0.6"/>

