  <circle cx="300" cy="80" r="80" fill="#0f3460" opacity="0.5" clip-path="url(#iconClip)"/>

  <g clip-path="url(#iconClip)">
    <!-- 책 1 (맨 아래, 파랑) -->
    <rect x="60" y="298" width="280" height="36" rx="4" fill="#4a90d9"/>
    <rect x="60" y="298" width="20" height="36" rx="3" fill="#2e6ca8"/>
    <rect x="72" y="308" width="5" height="18" rx="1" fill="#6aaff0" opacity="0.6"/>

    <!-- 책 2 (주황) -->
    <rect x="72" y="264" width="256" height="34" rx="4" fill="#e8954a"/>
