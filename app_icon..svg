    <circle cx="192.5" cy="126.5" r="1.2" fill="white"/>
    <circle cx="210.5" cy="126.5" r="1.2" fill="white"/>
    <!-- 볼터치 -->
    <circle cx="185" cy="133" r="4.5" fill="#f0a0a0" opacity="0.5"/>
    <circle cx="215" cy="133" r="4.5" fill="#f0a0a0" opacity="0.5"/>
    <!-- 입 -->
    <path d="M194 137 Q200 142 206 137" fill="none" stroke="#2a2a2a" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 귀 -->
    <circle cx="182" cy="114" r="6" fill="#f5e6c8"/>
